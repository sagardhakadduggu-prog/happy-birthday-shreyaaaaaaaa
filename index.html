<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Countdown</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ff4d6d,#ff85a2);
    color:white;
    text-align:center;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

.container{
    z-index:10;
}

h1{
    font-size:3rem;
}

#countdown{
    font-size:2rem;
    margin-top:20px;
    font-weight:bold;
}

.balloon{
    position:absolute;
    font-size:40px;
    animation:float 8s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
    }
    to{
        transform:translateY(-150px);
    }
}

#birthday{
    display:none;
}
</style>
</head>

<body>

<div class="container">

<h1>🎂 Shreya Birthday Countdown 🎂</h1>

<div id="countdown"></div>

<div id="birthday">
    <h1>🎉 HAPPY BIRTHDAY SHREYA 🎉</h1>
    <h2>🥳 Have a Wonderful Day 🥳</h2>

    <button onclick="document.getElementById('song').play()">
        🎵 Play Birthday Song
    </button>
</div>

</div>

<audio id="song">
    <source src="birthday.mp3" type="audio/mpeg">
</audio>

<script>

// 10 November
const birthday = new Date("Nov 10, 2026 00:00:00").getTime();

const countdown = document.getElementById("countdown");

setInterval(function(){

    const now = new Date().getTime();
    const distance = birthday - now;

    const days =
        Math.floor(distance/(1000*60*60*24));

    const hours =
        Math.floor((distance%(1000*60*60*24))
        /(1000*60*60));

    const minutes =
        Math.floor((distance%(1000*60*60))
        /(1000*60));

    const seconds =
        Math.floor((distance%(1000*60))
        /1000);

    countdown.innerHTML =
    days+" Days "+
    hours+" Hours "+
    minutes+" Minutes "+
    seconds+" Seconds";

    if(distance < 0){

        countdown.style.display="none";

        document.getElementById("birthday")
        .style.display="block";

        createBalloons();
    }

},1000);

function createBalloons(){

    setInterval(function(){

        let balloon =
        document.createElement("div");

        balloon.className="balloon";

        balloon.innerHTML="🎈";

        balloon.style.left=
        Math.random()*100+"vw";

        document.body.appendChild(balloon);

        setTimeout(()=>{
            balloon.remove();
        },8000);

    },300);
}

</script>

</body>
</html>
